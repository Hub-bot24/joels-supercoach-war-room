/* Mobile Option B: Level 3 horizontal scroll + Bye Planner card-style (mobile only) */
@media(max-width:720px){
  #level3 .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  #level3 .tbl-scroll table{min-width:600px;margin:0}
  #level3 .tbl-scroll th,#level3 .tbl-scroll td{white-space:nowrap}
  #level3 .tbl-scroll td.small{white-space:normal;max-width:200px}
  #bye table,#bye thead,#bye tbody,#bye tr,#bye th,#bye td{display:block}
  #bye thead{position:absolute;left:-9999px;top:-9999px}
  #bye tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:8px 12px;background:linear-gradient(180deg,rgba(15,26,43,.96),rgba(7,14,26,.96))}
  #bye td{border:none;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  #bye td::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:700}
  #bye td[data-label="Round"]{display:block;font-size:15px;font-weight:900;border-bottom:1px solid var(--line);padding:0 0 6px;margin-bottom:4px}
  #bye td[data-label="Round"]::before{content:"Round ";color:var(--text);font-size:15px;font-weight:900}
  #bye td[data-label="Missing"]{display:block;padding-top:6px}
  #bye td[data-label="Missing"]::before{display:block;margin-bottom:4px}
}

/* =========================================================
   MY TEAM CARD FRAME
   An earlier "No card box" patch deliberately dropped the card's
   border/background so the player cutout floats directly on the pitch.
   In practice that leaves score, position tag, photo and name as four
   disconnected floating elements with nothing tying them into one card -
   reads as scattered pieces rather than a single designed card. This adds
   a real frame back without touching any of that patch's photo/name/
   score/tag positioning math, which is otherwise sound.

   display:block is load-bearing here, not cosmetic: an unrelated legacy
   rule elsewhere still applies grid-template-columns to this same element,
   and its position:absolute children (score/tag/photo/name) still carry
   old grid-column/grid-row placements from an even earlier card design.
   Per the CSS Grid spec, an absolutely-positioned grid item with an
   explicit grid area uses THAT area as its containing block, not the
   whole card - so those children were rendering positioned against a
   ~32px-wide grid cell instead of the full 190px card, spilling outside
   the frame this rule adds. Forcing block layout removes the grid
   formatting context entirely, so top/left/bottom/right resolve against
   the full card padding box, exactly as the patch's positioning math
   assumes. */
#team.active-tab .formation-card:not(.formation-empty){
 display:block!important;
 width:190px!important;
 min-width:190px!important;
 max-width:190px!important;
 height:170px!important;
 min-height:170px!important;
 max-height:170px!important;
 background:linear-gradient(180deg,rgba(12,26,17,.38) 0%,rgba(5,14,9,.86) 58%,rgba(2,8,5,.96) 100%)!important;
 border:1px solid color-mix(in srgb,var(--accent) 55%,rgba(255,255,255,.16))!important;
 border-radius:16px!important;
 box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)!important;
}
/* A separate, later duplicate of the original "Bigger player cutout" patch
   (search "Projected score: upper-left shoulder") carries a stale
   left:calc(50% - 226px) for the score, clearly leftover math from a
   different, wider container - it wins by source order and throws the
   score off-card entirely. Restating the correct values here, later again,
   settles it without having to excavate and delete every duplicate. */
#team.active-tab .formation-card:not(.formation-empty) .wr-player-photo,
#team.active-tab .formation-card:not(.formation-empty) .wr-player-photo.team-logo-img,
#team.active-tab .formation-card:not(.formation-empty) .wr-team-logo,
#team.active-tab .formation-card:not(.formation-empty) .wr-team-logo.team-logo-img{
 left:50%!important;
 right:auto!important;
 bottom:27px!important;
 top:auto!important;
 transform:translateX(-50%)!important;
}
#team.active-tab .formation-card:not(.formation-empty) .formation-name{
 left:50%!important;
 right:auto!important;
 bottom:30px!important;
 top:auto!important;
 transform:translateX(-50%)!important;
}
#team.active-tab .formation-card:not(.formation-empty) .formation-score{
 left:7px!important;
 right:auto!important;
 top:27px!important;
 bottom:auto!important;
 transform:none!important;
}
#team.active-tab .formation-card:not(.formation-empty) .wr-slot-tag{
 left:auto!important;
 right:7px!important;
 top:32px!important;
 bottom:auto!important;
 transform:none!important;
}
#team.active-tab .formation-card:not(.formation-empty) > .status-dot,
#team.active-tab .formation-card:not(.formation-empty) > .status-indicators{
 left:15px!important;
 right:auto!important;
 top:55px!important;

}

/* Real bug found via the pre-existing card-collision regression test: the
   4-across CTW row's column spacing is only ~141px center-to-center at
   1024-1400px container widths (vs 190px+ at wider ones) - a pre-existing
   fact of this grid, unrelated to the card frame above. Adjacent 190px
   cards have always visually overlapped by ~49px there; it was invisible
   only because the score/tag positioning bug above (now fixed) happened
   to keep both badges out of the shared zone by accident. Now that they
   sit correctly on their own card, that accidental safety is gone, so the
   card needs to actually fit the available column width at this range
   instead of just moving badges around within an oversized card. */
@media(max-width:1400px){
 #team.active-tab .formation-card:not(.formation-empty){
  width:138px!important;
  min-width:138px!important;
  max-width:138px!important;
  height:124px!important;
  min-height:124px!important;
  max-height:124px!important;

 #team.active-tab .formation-card:not(.formation-empty) .wr-player-photo,
 #team.active-tab .formation-card:not(.formation-empty) .wr-player-photo.team-logo-img,

  width:86px!important;
  height:83px!important;
  min-width:86px!important;
  min-height:83px!important;
  max-width:86px!important;
  max-height:83px!important;
  bottom:20px!important;
 }
 #team.active-tab .formation-card:not(.formation-empty) .formation-name{
  bottom:22px!important;
  font-size:11px!important;
  max-width:128px!important;
 }
 #team.active-tab .formation-card:not(.formation-empty) .formation-score{
  left:5px!important;
  top:20px!important;
  font-size:18px!important;

 #team.active-tab .formation-card:not(.formation-empty) .wr-slot-tag{
  right:5px!important;
  top:24px!important;

 #team.active-tab .formation-card:not(.formation-empty) > .status-dot,
 #team.active-tab .formation-card:not(.formation-empty) > .status-indicators{

  top:41px!important;
 }
}

/* Animates a .wr-gauge from 0 to a real value instead of snapping straight
   to the final reading - respects prefers-reduced-motion (jumps straight
   to the end state for those users instead of animating). */
function animateGauge(el,pct,label,duration=900){
 if(!el)return;
 pct=Math.max(0,Math.min(100,pct));
 const numEl=el.querySelector('b');
 const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
 if(reduced){el.style.setProperty('--gauge-progress',pct+'%');if(numEl)numEl.textContent=label;return}
 const start=performance.now();
 function frame(now){
  const t=Math.min(1,(now-start)/duration);
  const eased=1-Math.pow(1-t,3);
  el.style.setProperty('--gauge-progress',(pct*eased)+'%');
  if(numEl)numEl.textContent=Math.round(pct*eased);
  if(t<1)requestAnimationFrame(frame);else if(numEl)numEl.textContent=label;
 }
 requestAnimationFrame(frame);
}

function wrRangeBarHtml(pr){

// Real per-round score trend on the player card, drawn straight from
// App.formHistory (data/history/scores/<year>.json - see #277/loadFormHistory).
// Every point plotted is a genuine captured SuperCoach score for that exact
// round; a round the player didn't play (or that hasn't been captured yet)
// is simply absent, never interpolated or zero-filled. Renders nothing
// rather than a misleading line when there's fewer than 2 real points.
function playerFormSparklineHtml(p){
 const rounds=App.formHistory?.players?.[p?.name];
 if(!rounds||typeof rounds!=='object')return '';
 const points=Object.entries(rounds)
  .map(([round,score])=>({round:Number(round),score:Number(score)}))
  .filter(pt=>Number.isFinite(pt.round)&&Number.isFinite(pt.score))
  .sort((a,b)=>a.round-b.round)
  .slice(-8);
 if(points.length<2)return '';
 const scores=points.map(pt=>pt.score);
 const lo=Math.min(...scores),hi=Math.max(...scores);
 const span=hi-lo||1;
 const w=200,h=44,pad=4;
 const coords=points.map((pt,i)=>{
  const x=points.length>1?pad+(i/(points.length-1))*(w-pad*2):w/2;
  const y=pad+(1-(pt.score-lo)/span)*(h-pad*2);
  return {x,y};
 });
 const pathD=coords.map((c,i)=>`${i===0?'M':'L'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
 const first=scores[0],last=scores[scores.length-1];
 const trendUp=last>first,trendFlat=last===first;
 const trendColor=trendFlat?'#9fb0c7':(trendUp?'#32d168':'#ff4d4d');
 const trendArrow=trendFlat?'→':(trendUp?'↑':'↓');
 const dots=coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${i===coords.length-1?3.4:2.2}" fill="${i===coords.length-1?trendColor:'rgba(255,255,255,.55)'}"/>`).join('');
 return `<div class="wr-form-spark">
  <div class="wr-form-spark-head"><span>Last ${points.length} Rounds</span><b style="color:${trendColor}">${trendArrow} ${esc(first)} → ${esc(last)}</b></div>
  <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Recent SuperCoach score trend">
   <path d="${pathD}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   ${dots}
  </svg>
 </div>`;
}

// Data files change on a ~15min+ generation cadence (see startLiveStatusRefresh),
// but a millisecond-unique cache-busting query used to force the browser to
// re-download every JSON file (2+MB) from network on every single page open,
// even seconds apart - a 5-minute bucketed cache key was a first pass at this,
// but it only ever helped a reload within the SAME 5-minute window; the
// 10-minute refreshTrustDataNow() cycle always crosses that boundary, so it
// still re-downloaded everything on every tick regardless of whether the
// data underneath had actually changed.
//
// {cache:'no-cache'} (not to be confused with no-store) tells the browser to
// always revalidate with the server - never silently serve a stale response -
// but to accept a 304 Not Modified with no body when the server reports
// nothing changed (via the ETag/Last-Modified headers virtually every static
// host sends by default), instead of always paying for the full download.
// Real freshness on every request, at the actual bandwidth cost of a 304.
async function fetchJson(path,fallback){try{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){return fallback}}
async function fetchJsonFirst(paths,fallback=null){for(const path of paths){try{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)continue;return await r.json()}catch(e){}}return fallback}

function normalisePosToken(value){
 const s=String(value||'').trim().toUpperCase();
 if(!s)return '';
 const cleaned=s
  .replace(/^HKR$/,'HOK')
  .replace(/^HOOKER$/,'HOK')
  .replace(/^FR$/,'FRF')
  .replace(/^PROP$/,'FRF')
  .replace(/^FRONT ROW$/,'FRF')
  .replace(/^SRF$/,'2RF')
  .replace(/^SECOND ROW$/,'2RF')
  .replace(/^2ND ROW$/,'2RF')
  .replace(/^HB$/,'HFB')
  .replace(/^HALFBACK$/,'HFB')
  .replace(/^FE$/,'5/8')
  .replace(/^FIVE EIGHTH$/,'5/8')
  .replace(/^FIVE-EIGHTH$/,'5/8')
  .replace(/^WFB$/,'FLB')
  .replace(/^FB$/,'FLB')
  .replace(/^FULLBACK$/,'FLB')
  .replace(/^WING$/,'CTW')
  .replace(/^CENTRE$/,'CTW')
  .replace(/^CENTER$/,'CTW');
 return POS_ALIAS[cleaned]||cleaned;
}

function normalisePosList(value){
 if(value==null)return [];
 const out=[];
 const add=v=>{
  const pos=normalisePosToken(v);
  if(pos&&POS_ALIAS[pos]&&!out.includes(POS_ALIAS[pos]))out.push(POS_ALIAS[pos]);
  else if(pos&&['HOK','FRF','2RF','HFB','5/8','CTW','FLB'].includes(pos)&&!out.includes(pos))out.push(pos);
 };

 if(Array.isArray(value)){
  value.forEach(v=>{
   if(Array.isArray(v)||typeof v==='object')normalisePosList(v).forEach(add);
   else add(v);
  });
  return out;
 }

 if(typeof value==='object'){
  for(const key of ['positions','eligiblePositions','dualPositions','positionList','eligible','pos','position','primaryPosition','sc_positions','supercoachPositions']){
   const got=normalisePosList(value[key]);
   got.forEach(add);
  }
  if(value.primary&&value.secondary)normalisePosList([value.primary,value.secondary]).forEach(add);
  if(value.primary)normalisePosList(value.primary).forEach(add);
  if(value.position1||value.position2)normalisePosList([value.position1,value.position2].filter(Boolean)).forEach(add);
  return out;
 }

 // Critical: never split on "/" because "5/8" is a real position.
 String(value)
  .split(/[,|+;]+/)
  .map(x=>x.trim())
  .filter(Boolean)
  .forEach(add);

 return out;
}

function canonicalPlayerNameKey(value){
 return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}

// Every lookupPositionAuthority() call used to fall back to
// Object.keys(table).find(k=>keys.includes(canonicalPlayerNameKey(k))) -
// a full rescan of the table with a Unicode-normalizing key computed fresh
// for every entry, every single call. positions()/eligible() call this per
// player per slot check, so a Bye Planner render (rounds x slots x
// candidates) or any formation render triggered thousands of these scans.
// Cache the canonical-key index per table object instead: a WeakMap keyed
// on the table reference itself invalidates automatically the moment a
// data refresh swaps in a genuinely new positionMaster/dualPositions/
// positionOverrides object, so this can never serve a stale table.
const _posTableIndexCache=new WeakMap();
function canonicalKeyIndexFor(table){
 let idx=_posTableIndexCache.get(table);
 if(!idx){
  idx=new Map();
  // First-occurrence wins, matching the original Object.keys(table).find()
  // iteration order.
  for(const k of Object.keys(table)){
   const ck=canonicalPlayerNameKey(k);
   if(!idx.has(ck))idx.set(ck,k);
  }
  _posTableIndexCache.set(table,idx);
 }
 return idx;
}

function lookupPositionAuthority(p){
 if(!p)return [];
 const names=[p.name,p.sourceName,p.statsSourceName].filter(Boolean);
 const keys=names.map(canonicalPlayerNameKey).filter(Boolean);
 const tables=[];

 if(App.positionMaster?.players)tables.push(App.positionMaster.players);
 if(App.positionMaster)tables.push(App.positionMaster);
 if(App.dualPositions?.players)tables.push(App.dualPositions.players);
 if(App.dualPositions)tables.push(App.dualPositions);
 if(App.positionOverrides?.players)tables.push(App.positionOverrides.players);
 if(App.positionOverrides)tables.push(App.positionOverrides);

 for(const table of tables){
  if(!table||Array.isArray(table)||typeof table!=='object')continue;

  for(const n of names){
   if(Object.prototype.hasOwnProperty.call(table,n)){
    const got=normalisePosList(table[n]);
    if(got.length)return got;
   }
  }

  const idx=canonicalKeyIndexFor(table);
  let found;
  for(const key of keys){if(idx.has(key)){found=idx.get(key);break;}}
  if(found){
   const got=normalisePosList(table[found]);
   if(got.length)return got;
  }
 }

 return [];
}

function addPositionsUnique(out,value){
 normalisePosList(value).forEach(pos=>{
  if(pos&&!out.includes(pos))out.push(pos);
 });
 return out;
}

// Real NRL SuperCoach rules make a player eligible in at most 2 positions,
// ever - this is a permanent domain fact, not a guess. Every position list
// this app resolves has to pass through here as the final checkpoint, so a
// corrupt upstream source (bad scrape, stale generated file, a malformed
// override) can never reach the UI as an impossible 3+ position player.
function capPositions(list,p){
 if(!Array.isArray(list)||list.length<=2)return list;
 console.warn(`[positions] ${p?.name||'unknown player'} resolved to ${list.length} positions (${list.join('/')}) - impossible for SuperCoach (max 2 ever). Showing first 2 only; upstream data needs correction.`);
 return list.slice(0,2);
}
function positions(p){
 if(!p)return [];

 // CORE RULE: generated/master position authority wins first.
 const authority=lookupPositionAuthority(p);
 if(authority.length)return capPositions(authority,p);

 // Fallback only when the player has no generated/master authority.
 const out=[];
 for(const key of ['positions','eligiblePositions','dualPositions','positionList','eligible','pos','position','primaryPosition']){
  addPositionsUnique(out,p[key]);
 }
 return capPositions(out,p);
}

function positionText(p,fallback=''){

}

function eligible(p,slot){

}

/* Season Journey - a real, honest record of what your OWN team actually
   scored each round, built by literally recording your real lineup at
   the moment each round ends and later filling in the real result once
   it's captured (data/history/scores/<year>.json - see #277). This can
   only ever start from the round you first open the app after shipping
   this feature; there is no way to reconstruct earlier rounds without
   guessing at a lineup that was never recorded, so those are an honest
   gap, not backfilled. See captureSeasonJournalSnapshotIfNeeded() and
   finalizeSeasonJournalEntries(), called from boot() around the exact
   moment App.round advances to a new real round. */

// The nrlsupercoachstats.com per-round columns are published for the
// whole site at once (see capture-player-scores.mjs), not incrementally
// per real-world game - so the highest round number seen ANYWHERE in the
// captured dataset is real evidence that round is fully finalized site-
// wide, without needing every one of your own 13 fielded players to have
// personally played (a genuine bye/DNP for one of them would otherwise
// look identical to "not captured yet" and stall this forever).
function seasonJournalMaxCapturedRound(){
 let max=0;
 const players=App.formHistory?.players||{};
 for(const rec of Object.values(players)){
  if(!rec||typeof rec!=='object')continue;
  for(const r of Object.keys(rec)){
   const n=Number(r);
   if(Number.isFinite(n)&&n>max)max=n;
  }
 }
 return max;
}

// Pure so it's directly testable. entry: {round,lineup,captain,vice}.
// playersScores: App.formHistory.players shape, {name:{round:score}}.
// A fielded player absent from playersScores for this round is scored 0
// (real bye/DNP), never fabricated or estimated - same real captain/vice
// fallback rule teamProjection() already uses for live projections
// (double the captain if they played, otherwise the vice), just applied
// to real captured scores instead of a projection.
function computeActualRoundScore(entry,playersScores){
 const lineup=entry?.lineup||{};
 const names=Object.values(lineup).filter(Boolean);
 if(!names.length)return null;
 const roundKey=String(entry.round);
 const perPlayer={};
 let base=0;
 for(const name of names){
  const rec=playersScores?.[name];
  const raw=rec?Number(rec[roundKey]):undefined;
  const score=Number.isFinite(raw)?raw:0;
  perPlayer[name]=score;
  base+=score;
 }
 const captainScore=entry.captain?(perPlayer[entry.captain]||0):0;
 const captainPlayed=Boolean(entry.captain)&&captainScore>0;
 const viceScore=entry.vice?(perPlayer[entry.vice]||0):0;
 const doubled=captainPlayed?captainScore:viceScore;
 return {total:Math.round(base+doubled),perPlayer};
}

// Called from boot() while App.round still equals the round that's
// about to be superseded (i.e. before syncCurrentRound() advances it) -
// at that exact moment App.lineup/App.myTeam are still whatever they
// really were during that just-finished round, since nothing has
// changed yet this page load.
function captureSeasonJournalSnapshotIfNeeded(previousRound){
 if(!Number.isFinite(previousRound)||previousRound<1)return false;
 if(App.round!==previousRound)return false;
 if(!Array.isArray(App.myTeam)||!App.myTeam.length)return false;
 App.seasonJournal=Array.isArray(App.seasonJournal)?App.seasonJournal:[];
 if(App.seasonJournal.some(e=>e.round===previousRound))return false;
 const state=teamRenderState();
 if(!state.fieldSlots.length)return false;
 const picks=captainVicePicks(state);
 const teamValue=teamPlayers().reduce((sum,p)=>sum+safeNum(p.price),0);
 const lineup={};
 for(const {slot,name} of state.fieldSlots)lineup[slot.id]=name;
 App.seasonJournal.push({
  round:previousRound,
  snapshotAt:new Date().toISOString(),
  lineup,
  captain:picks.captain?.name||null,
  vice:picks.vice?.name||null,
  teamValue,
  actualScore:null,
  scoredAt:null
 });
 return true;
}

// Called after syncCurrentRound() (and after loadFormHistory()) so any
// journal entry whose round has real data available now gets its
// honest final score filled in - idempotent, never rescoring an entry
// that's already been finalized once.
function finalizeSeasonJournalEntries(){
 if(!Array.isArray(App.seasonJournal)||!App.seasonJournal.length)return false;
 const maxRound=seasonJournalMaxCapturedRound();
 if(!maxRound)return false;
 const scores=App.formHistory?.players||{};
 let changed=false;
 for(const entry of App.seasonJournal){
  if(entry.actualScore!=null)continue;
  if(entry.round>maxRound)continue;
  const result=computeActualRoundScore(entry,scores);
  if(!result)continue;
  entry.actualScore=result.total;
  entry.scoredAt=new Date().toISOString();
  changed=true;
 }
 return changed;
}

// Cross-device durability: a device merging in a cloud copy must never
// silently drop a round the OTHER device already recorded or scored -
// keep every distinct round, preferring whichever copy of a shared round
// already has a real actualScore over one still pending.
function mergeSeasonJournal(local,cloud){
 const byRound=new Map();
 for(const e of (Array.isArray(local)?local:[])){
  if(e&&Number.isFinite(e.round))byRound.set(e.round,e);
 }
 for(const e of (Array.isArray(cloud)?cloud:[])){
  if(!e||!Number.isFinite(e.round))continue;
  const existing=byRound.get(e.round);
  if(!existing||(existing.actualScore==null&&e.actualScore!=null))byRound.set(e.round,e);
 }
 return [...byRound.values()].sort((a,b)=>a.round-b.round);
}

/* Real freshness readout instead of the always-blank stub this was. The
   status-truth pipeline is configured to run every 15 minutes, but
   GitHub's scheduled-workflow runner is well documented to lag under
   load - verified against this repo's own run history that the real
   cadence is closer to hourly. A war-room tool claiming "live" data
   should say how old that data actually is, not hide it. */
function formatFreshness(iso){
 const then=iso?new Date(iso).getTime():NaN;
 if(!Number.isFinite(then))return '';
 const mins=Math.max(0,Math.round((Date.now()-then)/60000));
 if(mins<1)return 'Updated just now';
 if(mins<60)return `Updated ${mins}m ago`;
 const hrs=Math.floor(mins/60);
 if(hrs<24)return `Updated ${hrs}h ${mins%60}m ago`;
 return `Updated ${Math.floor(hrs/24)}d ago`;
}
function updateStatusFreshnessLabel(){

 // App.trustWarnings is real, computed data (syncCurrentRound() flags a
 // genuine round auto-correction or detection failure here) that had
 // zero consumers anywhere in the app before this - it was computed and
 // then silently discarded every time. Surfacing it, not inventing it.
 fe.textContent=(warnings.length?'⚠ ':'')+formatFreshness(iso);
 const then=iso?new Date(iso).getTime():NaN;
 const staleMins=Number.isFinite(then)?(Date.now()-then)/60000:Infinity;
 const timeTitle=staleMins===Infinity?'No status timestamp available':`Status data last confirmed ${new Date(then).toLocaleString()}`;
 fe.title=warnings.length?`${timeTitle}\n\n${warnings.join('\n')}`:timeTitle;
 fe.classList.remove('wr-fresh-ok','wr-fresh-warn','wr-fresh-bad');
 fe.classList.add(warnings.length?'wr-fresh-bad':staleMins<=30?'wr-fresh-ok':staleMins<=120?'wr-fresh-warn':'wr-fresh-bad');
}

  if(sub)consumedSelected[gap.group]=(consumedSelected[gap.group]||0)+1;
  return {...gap,sub};
 });
 const ranked=tentative.filter(g=>g.sub).sort((a,b)=>b.sub.pr.expected-a.sub.pr.expected);
 const allowedSlotIds=new Set(ranked.slice(0,AUTO_EMERGENCY_NON_BYE_CAP).map(g=>g.slotId));
 for(const gap of tentative){
  bySlotId[gap.slotId]=allowedSlotIds.has(gap.slotId)?gap.sub.player:null;
 }

 return bySlotId;
}
function teamProjection(state=null,picks=null,subs=null){
 if(!state)state=teamRenderState();
 if(!picks)picks=captainVicePicks(state);
 if(!subs)subs=autoEmergencySubstitutes(state);

 const baseTotal=SLOT_DEFS.reduce((s,slot)=>{
  const p=getPlayer(App.lineup?.[slot.id]);
  const starterExpected=roundProj(p).expected;
  const sub=subs[slot.id];
  const effectiveExpected=starterExpected>0?starterExpected:(sub?roundProj(sub).expected:0);
  return s+effectiveExpected;
 },0);

 // Real captaincy rule: double the captain's score if they actually play;
 // if they don't (the guaranteed-bye loophole, or an unexpected
 // withdrawal), the vice-captain's score doubles instead. The vice is
 // always an on-field, already-playing candidate (captainAdvisorCandidates
 // only considers pr.expected>0), so their score is already counted once
 // in baseTotal above - adding it again here is the actual doubling.
 const captainPlayer=picks.captain?getPlayer(picks.captain.name):null;
 const vicePlayer=picks.vice?getPlayer(picks.vice.name):null;
 const captainPlays=!!(captainPlayer&&roundProj(captainPlayer).expected>0);
 const doubleTarget=captainPlays?captainPlayer:(vicePlayer&&roundProj(vicePlayer).expected>0?vicePlayer:null);
 const doublingBonus=doubleTarget?roundProj(doubleTarget).expected:0;

 return baseTotal+doublingBonus;
}

function syncRoundFromGeneratedTruth(){
  const generatedRound = Number(App.currentRoundMeta?.round || App.statusTruth?.round || 0);
  if(Number.isFinite(generatedRound) && generatedRound > 0 && App.round !== generatedRound){
    App.round = generatedRound;
    App.roundSource = App.currentRoundMeta?.round ? 'current_round.json' : 'status_truth.json';
    try{ localStorage.setItem('sc_round', String(App.round)); }catch(e){}
    if(App.projectionCache && typeof App.projectionCache.clear === 'function') App.projectionCache.clear();
  }
}

}

function reserveBucket(p){
 const ps=positions(p);

 if(ps.includes('HOK')) return 'HOOKER';
 if(ps.includes('FRF')) return 'FRONT ROWERS';
 if(ps.includes('2RF')) return '2ND ROW FORWARDS';
 if(ps.includes('HFB')) return 'HALFBACK';
 if(ps.includes('FE') || ps.includes('5/8')) return '5/8';

 // CTW/FLB duals stay with CTW.
 if(ps.includes('CTW')) return 'WINGS / CENTRES';

 // Pure fullbacks go here.
 if(ps.includes('FLB')) return 'FULLBACK';

 return 'FULLBACK';
}

const TEAM_LOGO_ALIAS={NQL:'NQC',BRO:'BRI',CRO:'SHA',NZL:'PAR'};
function teamLogoCode(p){const k=teamKey(p);return TEAM_LOGO_ALIAS[k]||k}
function teamIconHtml(p,cls){const k=teamLogoCode(p);const src=TEAM_LOGOS[k];return src?`<div class="${cls} team-logo-img"><img src="${src}" alt="${esc(k)}"></div>`:`<div class="${cls}">${esc(k)}</div>`}
function wrPlayerCardPhotoHtml(p,cls){
 const fallback=esc(teamLogoCode(p)||'SC');
 const url=(typeof wrCardPlayerPhotoUrl==='function'?wrCardPlayerPhotoUrl(p):(typeof playerPhotoUrl==='function'?playerPhotoUrl(p):''));
 if(url){
  return `<div class="${cls} wr-player-photo"><img src="${esc(url)}" alt="${esc(p?.name||fallback)}" loading="lazy" onerror="this.onerror=null;this.parentNode.textContent='${fallback}'"></div>`;
 }
 return teamIconHtml(p,cls);
}
function teamKey(p){return String(p?.team||p?.club||'SC').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)}
function teamAccent(p){return TEAM_ACCENTS[teamKey(p)]||'#00d5d5'}
function posAccent(pos){const s=String(pos||'').toUpperCase();if(s.includes('FRF')||s.includes('HOK')||s.includes('2RF'))return '#f5c542';if(s.includes('CTW')||s.includes('FLB')||s.includes('FB'))return '#a855f7';if(s.includes('FLEX'))return '#32d168';return '#00d5d5'}
function formationFigureHtml(cls='formation-face'){return `<div class="${cls}"><div class="formation-figure" aria-hidden="true"><span class="formation-arm left"></span><span class="formation-arm right"></span></div></div>`}
function shortName(name){const parts=String(name||'').trim().split(/\s+/).filter(Boolean);if(parts.length>=2)return `${parts[0][0]}. ${parts.slice(1).join(' ')}`;return String(name||'')}

function formationStatusClass(p){const st=availabilityStatus(p);return st.key==='bye'?'bye':(st.key==='injured'||st.key==='suspended'||st.key==='notnamed'||st.key==='out')?'out':(st.key==='expected'||st.key==='origin'||st.key==='risk')?'risk':''}
function formationSlot(slotId,gridArea,picks={}){
 const slot=slotById[slotId],p=getPlayer(App.lineup?.[slotId]);
 if(!slot)return '';
 if(!p){
  return `<div class="formation-slot" style="grid-area:${gridArea}">
   <div class="formation-card formation-empty" style="--accent:#335074;--pos:#335074" data-slot="${slotId}" ondragover="allowDropOnSlot(event,'${slotId}')" ondragleave="clearDrop(event)" ondrop="dropOnSlot(event,'${slotId}')" onclick="emptyFieldTrade('${slotId}')">
    <div class="wr-slot-tag">${esc(slot.short)}</div>
    <div class="wr-team-logo">+</div>
    <div class="formation-name">Empty</div>
    <div class="formation-score">--</div>
    <div class="formation-meta">Tap to add a player</div>
   </div>
  </div>`;
 }
 const pr=roundProj(p),st=availabilityStatus(p),cls=statusDotClass(st);
 const accent=teamAccent(p),pa=posAccent(slot.short),opp=esc(p.opponent||p.opp||p.vs||'');
 const price=safeNum(p.price)?money(p.price):'';
 const be=safeNum(p.breakeven??p.breakEven??p.BE??p.be);
 const avg=safeNum(p.avg??p.average??p.seasonAvg);
 const team=esc((p.team||p.club||'SC').slice(0,3).toUpperCase());
 const playerPosText=positionText(p,slot.short);
 const isCaptain=picks?.captain?.name===p.name,isVice=!isCaptain&&picks?.vice?.name===p.name;
 // C/VC now renders inline, to the left of the player's name - not as a
 // badge stamped on the photo.
 const badgeHtml=isCaptain
  ?`<span class="formation-cv-badge formation-cv-captain${picks.captain.hasLoophole?'':' formation-cv-nolh'}" title="${esc(picks.captain.tooltip)}">C</span>`
  :isVice?`<span class="formation-cv-badge formation-cv-vice${picks.vice.hasLoophole?'':' formation-cv-nolh'}" title="${esc(picks.vice.tooltip)}">VC</span>`:'';
 return `<div class="formation-slot" style="grid-area:${gridArea}">
  <div class="formation-card ${formationStatusClass(p)}" style="--accent:${accent};--pos:${pa}" draggable="true" data-slot="${slotId}" onpointerdown="pressDragStart(event,'field','${slotId}','${window.jsq(p.name)}')" ondragstart="dragField(event,'${slotId}','${window.jsq(p.name)}')" ondragover="allowDropOnSlot(event,'${slotId}')" ondragleave="clearDrop(event)" ondrop="dropOnSlot(event,'${slotId}')">
   <div class="wr-slot-tag" title="${esc(slot.short)} slot">${esc(playerPosText)}</div>
   ${wrPlayerCardPhotoHtml(p,'wr-team-logo')}
   <div class="formation-name player-name-link" title="${esc(p.name)}" role="button" tabindex="0" onclick="openPlayerCard('${window.jsq(p.name)}')">${badgeHtml}${esc(p.name)}</div>
   <div class="formation-score">${pr.expected}</div>
   <div class="formation-meta">
    <span>${price}</span>
    <span>${be?`BE ${be}`:''}</span>
    <span>${avg?`AVG ${Math.round(avg)}`:''}</span>
   </div>
   ${projectionBoxHtml(p)}
   ${statusDot(p)}
   <div class="wr-card-footer">${statusDot(p)}<span>${esc(st.label)}</span><span>R${App.round}${opp?' · '+opp:''}</span></div>
  </div>
 </div>`;
}
function formationFieldHtml(fieldBySlot={},picks={}){
 // NOTE: these grid-area values are a fallback only. The #team.active-tab
 // scope (the real My Team view) overrides every slot's position via
 // higher-specificity :has([data-slot=...]) rules elsewhere in the
 // stylesheet - search for "CANONICAL 14-PLAYER FORMATION MAP" to find the
 // block that's actually authoritative there.
 const slots=[
  ['FRF1','1 / 1 / 2 / 2'],['HOK1','1 / 3 / 2 / 4'],['FRF2','1 / 5 / 2 / 6'],
  ['2RF1','2 / 2 / 3 / 3'],['2RF2','2 / 4 / 3 / 5'],['2RF3','3 / 3 / 4 / 4'],
  ['HFB1','4 / 2 / 5 / 3'],['FE1','4 / 4 / 5 / 5'],
  ['CTW1','5 / 1 / 6 / 2'],['CTW2','5 / 2 / 6 / 3'],['CTW3','5 / 4 / 6 / 5'],['CTW4','5 / 5 / 6 / 6'],
  ['FLB1','6 / 3 / 7 / 4'],
  ['FLEX1','4 / 5 / 5 / 6']
 ];
 return `<div class="formation-field"><div class="formation-watermark left">WAR</div><div class="formation-watermark right">ROOM</div><div class="formation-grid">${slots.map(([id,area])=>formationSlot(id,area,picks)).join('')}</div></div>`
}
function formationReserveCard(p,idx=0,slotId="",isSubstituting=false,picks={},isSelected=false){
 const pr=roundProj(p),st=availabilityStatus(p),cls=statusDotClass(st);

/* =========================================================
   Captain Advisor
   Reads the same live projection every other tab reads (roundProj -
   ProjectionEngine), so this can never disagree with the numbers shown
   elsewhere. No separate captain-scoring formula - just three honest
   lenses (raw ceiling of expected value, safest floor, biggest ceiling)
   over the field's real floor/expected/ceiling/confidence/reasons.
   ========================================================= */
function captainAdvisorRiskNote(player){
 const st=availabilityStatus(player);
 const key=String(st?.key||'').toLowerCase();
 if(key==='risk')return 'Selection risk - team list not fully locked in';
 if(key==='expected')return 'Not yet officially named - status could still change';
 return '';
}
function captainAdvisorReason(pr){
 const boring=/^(Recent scores relatively stable|No rain impact detected|Balanced season and recent form|No weather downgrade|Cold conditions noted)/;
 const picked=(pr.reasons||[]).filter(r=>r&&!boring.test(r)).slice(0,2);
 return picked.length?picked.join(' · '):'Solid underlying numbers, no standout factor either way';
}
function captainAdvisorCandidates(state){
 return (state.fieldSlots||[])
  .map(({name,player})=>({name,player,pr:roundProj(player)}))
  .filter(c=>c.player&&c.pr.expected>0);
}
// Compact captain/vice-captain picks - a star/VC badge directly on the
// field card (see formationSlot) rather than a separate panel, so the
// team page stays about showing the team.
//
// Captain = highest expected on the field. Vice-captain is NOT simply
// "2nd best" - it follows the real SuperCoach captaincy loophole: the VC
// must kick off BEFORE the captain, so if the captain's score turns out
// poor, captaincy can be switched to the VC (already locked in) before
// the captain's own game has even started. A VC who plays after the
// captain provides no such cover. If no real loophole candidate exists
// among the field, that is surfaced honestly rather than silently
// picking a same-time-or-later player and implying protection that isn't
// there - a straight, uncovered captain pick is a real, higher-risk
// situation, not a data gap to paper over.
function playerKickoffTime(player){
 const fixture=ProjectionEngine.fixtureForRound(player,App.round);
 const raw=fixture?.kickoffLocal||fixture?.kickoff||fixture?.date||fixture?.startTime;
 const t=raw?new Date(raw).getTime():NaN;
 return Number.isFinite(t)?t:null;
}
// Real SuperCoach captaincy rule: if the named Captain does not take the
// field, the Vice-Captain's score is automatically doubled instead. That
// single fact is what makes a ZERO-RISK loophole possible: nominate a
// confirmed-BYE player as "Captain" and your actual best real player as
// "Vice-Captain" - the bye captain's own score never matters, and the
// VC's score doubles with certainty.
//
// Confirmed: Captain AND Vice-Captain must BOTH be chosen from the 14
// on-field starters - never a bench/reserve player, not even one of the
// 4 selected reserves that count toward score. A bye player is only
// eligible for this loophole if they've deliberately been fielded in one
// of the 14 slots (swapped in for a bench player first) - exactly how the
// loophole is actually played in practice, not a whole-squad search.
// Only when no on-field player is a confirmed bye does this fall back to
// the weaker, timing-based partial loophole (vice plays before captain,
// so the armband could be moved before captain's kickoff if needed) -
// which the app is honest about being lower-certainty.
function captainVicePicks(state){
 const candidates=captainAdvisorCandidates(state);
 if(!candidates.length)return {captain:null,vice:null};
 const byExpected=[...candidates].sort((a,b)=>b.pr.expected-a.pr.expected);
 const bestPlayer=byExpected[0];

 // The default recommendation is always the straightforward real rule:
 // captain your highest real scorer, vice your best scorer among those
 // whose game kicks off before the captain's (so the captain genuinely
 // plays after the vice) - not an automatic bye-swap suggestion. The
 // guaranteed bye-loophole (nominate a confirmed-bye fielded player as
 // captain so the vice's score is doubled instead) is a real, valid, but
 // deliberate manual trade a user can choose to make themselves - the
 // advisor should not silently substitute it as the default pick.
 const captain=bestPlayer;
 const captainKickoff=playerKickoffTime(captain.player);
 const rest=byExpected.slice(1);
 const loopholeCandidates=captainKickoff!=null
  ?rest.filter(c=>{const t=playerKickoffTime(c.player);return t!=null&&t<captainKickoff})
  :[];
 const hasLoophole=loopholeCandidates.length>0;
 const vicePick=loopholeCandidates[0]||rest[0]||null;

 const captainRisk=captainAdvisorRiskNote(captain.player);
 const captainReason=captainAdvisorReason(captain.pr);
 const captainTooltip=`${captain.pr.expected} pts (floor ${captain.pr.floor} / ceiling ${captain.pr.ceiling}, ${captain.pr.confidence} confidence) - ${captainReason}${captainRisk?' - '+captainRisk:''}${!hasLoophole?' - No teammate plays before this game and no guaranteed-bye squad member available: straight captain, no loophole cover, higher risk if it goes wrong':''}`;

 let vice=null;
 if(vicePick){
  const risk=captainAdvisorRiskNote(vicePick.player);
  const reason=captainAdvisorReason(vicePick.pr);
  const coverNote=hasLoophole
   ?`Timing loophole cover - plays before ${captain.name}, so a poor captain score can still be covered`
   :`No loophole - plays at the same time or after ${captain.name}, so this is a structural VC only, not real cover`;
  vice={name:vicePick.name,tooltip:`${coverNote}. ${vicePick.pr.expected} pts (floor ${vicePick.pr.floor} / ceiling ${vicePick.pr.ceiling}, ${vicePick.pr.confidence} confidence) - ${reason}${risk?' - '+risk:''}`,risk,hasLoophole};
 }

 return {captain:{name:captain.name,tooltip:captainTooltip,risk:captainRisk,hasLoophole,isDeadCert:false},vice};
}

function tradeCacheKey(){
 return [
  App.round || "",
  (App.myTeam || []).join("|"),
  JSON.stringify(App.lineup || {}),
  JSON.stringify(App.reserveOrder || {})
 ].join("::");

function clearTradeOptionCache(){
 App.tradeOptionCache = new Map();
}

function sortedOutsidePlayers(){
 const key = "outside::" + tradeCacheKey();
 App.tradeOptionCache = App.tradeOptionCache || new Map();
 if(App.tradeOptionCache.has(key)) return App.tradeOptionCache.get(key);

 const owned = new Set(App.myTeam || []);
 const list = (App.players || [])
  .filter(p => p && p.name && !owned.has(p.name))
  .map(p => ({p, score: roundProj(p).expected || 0}))
  .sort((a,b) => b.score - a.score)
  .map(x => x.p);

 App.tradeOptionCache.set(key, list);
 return list;
}

function legalFieldTradeOptions(slot){
 const key = "field::" + tradeCacheKey() + "::" + (slot?.id || "");
 App.tradeOptionCache = App.tradeOptionCache || new Map();
 if(App.tradeOptionCache.has(key)) return App.tradeOptionCache.get(key);

 const list = sortedOutsidePlayers()
  .filter(p => eligible(p, slot));

 App.tradeOptionCache.set(key, list);
 return list;
}

function legalReserveTradeOptions(oldPlayer){
 const key = "reserve::" + tradeCacheKey() + "::" + (oldPlayer?.name || "");
 App.tradeOptionCache = App.tradeOptionCache || new Map();
 if(App.tradeOptionCache.has(key)) return App.tradeOptionCache.get(key);

 const list = sortedOutsidePlayers()
  .filter(p => tradeEligibleForPlayer(p, oldPlayer));

 App.tradeOptionCache.set(key, list);
 return list;
}
function playerTradePositions(p){const ps=positions(p);return ps.length?ps:[]}
function tradeEligibleForPlayer(candidate,oldPlayer){const oldPs=playerTradePositions(oldPlayer);if(!candidate||!oldPlayer||!oldPs.length)return false;const cps=positions(candidate);return oldPs.some(pos=>cps.includes(pos))}

/* =========================================================
   Trade Radar
   Forward-looking (next 5 games), not "who scored more this round".
   Reuses the same eligibility check (tradeEligibleForPlayer) and player
   pool (sortedOutsidePlayers' underlying owned-set logic) as the real
   Trade Lab, and ProjectionEngine.nextFive() - the same next-5 numbers
   shown on every player card - so a suggestion here can never contradict
   what the rest of the app already says about either player.
   ========================================================= */
function tradeRadarOutlook(player){
 const pr=roundProj(player);
 const next5=ProjectionEngine.nextFive(player);
 return {player,pr,next5,seasonAvg:pr.seasonAvg||0,outlookAvg:next5.available?(next5.avg||0):0};
}
function tradeRadarWeakLinks(){
 return (App.myTeam||[])
  .map(name=>getPlayer(name))
  .filter(Boolean)
  .map(p=>tradeRadarOutlook(p))
  .filter(o=>o.pr.expected>0&&o.next5.available&&o.seasonAvg>=30)
  .map(o=>({...o,declineRatio:o.seasonAvg?o.outlookAvg/o.seasonAvg:1}))
  .filter(o=>o.declineRatio<=0.85)
  .sort((a,b)=>a.declineRatio-b.declineRatio)
  .slice(0,3);
}
function tradeRadarReplacementFor(weakPlayer){
 const owned=new Set(App.myTeam||[]);
 // tradeRadarOutlook() is expensive (a real 5-round projection pass per
 // player), and this used to run it for every eligible free agent in the
 // whole database - hundreds of players - just to find the single best
 // one. Season average is already sitting on the player record at zero
 // cost, and a player near the bottom of it is never going to win this
 // comparison, so narrow to the real top-20 by that cheap number first
 // and only run the expensive projection on those.
 const eligible=(App.players||[]).filter(p=>p&&p.name&&!owned.has(p.name)&&tradeEligibleForPlayer(p,weakPlayer));
 const shortlist=eligible
  .map(p=>({p,cheapAvg:safeNum(p.avg??p.average??p.seasonAvg)}))
  .sort((a,b)=>b.cheapAvg-a.cheapAvg)
  .slice(0,20)
  .map(x=>x.p);
 const candidates=shortlist
  .map(p=>tradeRadarOutlook(p))
  .filter(o=>o.next5.available&&o.outlookAvg>0)
  .sort((a,b)=>b.outlookAvg-a.outlookAvg);
 return candidates[0]||null;
}

/* War Room Briefing - one glance at the top of My Team synthesizing the
   real signals the rest of the app already computes: your own team's
   Form Radar movers, Trade Radar's single best real upgrade, Crystal
   Ball's real accuracy status, and any of your players on bye next
   round. Every row only appears when its underlying feature already has
   real data to show; nothing here is computed specially for this card. */
function warRoomBriefingRows(){
 const rows=[];
 const owned=new Set(App.myTeam||[]);
 const mine=formRadarRows().filter(o=>owned.has(o.p.name));
 const riser=[...mine].filter(o=>o.delta>=5).sort((a,b)=>b.delta-a.delta)[0];
 const faller=[...mine].filter(o=>o.delta<=-5).sort((a,b)=>a.delta-b.delta)[0];
 if(riser)rows.push({icon:'pulse',tone:'good',text:`${riser.p.name} is heating up - last 3 rounds +${Math.round(riser.delta)} above season average.`});
 if(faller)rows.push({icon:'pulse',tone:'bad',text:`${faller.p.name} has cooled off - last 3 rounds ${Math.round(faller.delta)} below season average.`});

 const weak=tradeRadarWeakLinks()[0];
 if(weak){
  const replacement=tradeRadarReplacementFor(weak.player);
  const upgrade=replacement?Math.round(replacement.outlookAvg-weak.outlookAvg):0;
  if(replacement&&upgrade>0)rows.push({icon:'trade',tone:'info',text:`Trade Radar: ${weak.player.name} → ${replacement.player.name} is worth +${upgrade} pts/game over the next 5.`});
 }

 const acc=App.projectionAccuracy;
 if(acc?.overall)rows.push({icon:'crystal',tone:'info',text:`Crystal Ball: projections are averaging ±${acc.overall.meanAbsoluteError} pts real error across ${acc.overall.samples} results this season.`});

 const nextRound=Number(App.round||1)+1;
 const affected=teamPlayers().filter(p=>(p.bye||p.byes||[]).map(Number).includes(nextRound));
 if(affected.length)rows.push({icon:'bye',tone:'warn',text:`${affected.length} of your players ${affected.length===1?'is':'are'} on bye in R${nextRound}: ${affected.map(p=>p.name).join(', ')}.`});

 return rows;
}

function wrPhotoKey(v){
  return String(v||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/['’`.,\-]/g,"")
    .replace(/\s+/g,"")
    .trim();
}
function wrUsablePhotoUrl(url){
  const u=String(url||"");
  if(!u)return false;
  if(/index\.php\?player=/i.test(u))return false;
  if(/previewMain|preview-main|placeholder|logo|badge|crest|favicon|default/i.test(u))return false;
  if(/remote\.axd$/i.test(u))return false;
  return /rugbyimages\.statsperform\.com|Player%20Bodyshots|Player\+Bodyshots|remote\.axd\?/i.test(u) || /\.(png|jpg|jpeg|webp)(\?|$)/i.test(u);
}
function wrCardPlayerPhotoUrl(p){
  if(!p)return "";
  const rec=lookupPlayerPhotoRecord(p);
  const url=playerPhotoRecordUrl(rec);
  if(wrUsablePhotoUrl(url))return url;
  const fallback=p.photo||p.image||p.headshot||p.nrlPhoto||p.playerPhoto||"";
  return wrUsablePhotoUrl(fallback)?fallback:"";
}

function wrCardNum(v){
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function wrCardScores(p){
  const lists = [p?.scores,p?.recentScores,p?.lastScores,p?.gameScores,p?.history,p?.matches];
  for(const raw of lists){
    if(!Array.isArray(raw)) continue;
    const arr = raw.map(x=>{
      if(typeof x === "number") return x;
      if(!x || typeof x !== "object") return NaN;
      return Number(x.score ?? x.sc ?? x.points ?? x.supercoach ?? x.total);
    }).filter(Number.isFinite);
    if(arr.length) return arr;
  }
  return [];
}
function wrCardRecentAverage(p,count){
  const direct = count === 3
    ? wrCardNum(p?.last3Avg ?? p?.avg3 ?? p?.l3Avg)
    : wrCardNum(p?.last5Avg ?? p?.avg5 ?? p?.l5Avg);

  if(direct) return Math.round(direct);

  const loose = count === 3
    ? wrCardNum(p?.last3 ?? p?.lastThree ?? p?.l3)
    : wrCardNum(p?.last5 ?? p?.lastFive ?? p?.l5);

  if(loose) return Math.round(loose);

  const scores = wrCardScores(p);
  if(scores.length >= count){
    const recent = scores.slice(-count);
    return Math.round(recent.reduce((s,n)=>s+n,0) / recent.length);
  }

  return "-";
}

// Shared by the always-visible injury summary and the fuller "Details"
// breakdown, so both read from one extraction of the real, sourced injury
// data (NRL casualty ward / Zero Tackle, see scripts/update-status.mjs) -
// no duplicated parsing to drift out of sync.
function injuryFactsFor(p,st,truth){
  const rec=truth||st?.truth||{};
  const key=String(st?.key||truthKeyFromRecord(rec)||"").toLowerCase();
  const rawStatus=String(rec?.raw?.status||rec?.status||"").toLowerCase().trim();
  const displayStatus=String(rec?.displayStatus||"").toUpperCase().trim();
  const isInjury=key==="injured"||key==="injury"||displayStatus==="INJURED"||displayStatus==="INJURY"||rawStatus==="injured"||rawStatus==="injury"||(rawStatus==="out"&&displayStatus==="INJURED");
  if(!isInjury)return null;
  const type=rec?.injuryType||rec?.injuryNote||rec?.raw?.reason||"";
  const expected=rec?.expectedReturnText||rec?.raw?.expectedReturn||"";
  const min=rec?.expectedReturnRoundMin||rec?.raw?.returnWindowMinRound;
  const max=rec?.expectedReturnRoundMax||rec?.raw?.returnWindowMaxRound;
  const minW=rec?.raw?.returnWindowMinWeeks;
  const maxW=rec?.raw?.returnWindowMaxWeeks;
  const src=truthSourceText(rec)||((rec?.raw?.sources||[]).map(s=>s?.source||s?.name).filter(Boolean).slice(0,3).join(" + "));
  const updatedRec={updatedAt:rec?.injuryUpdatedAt||rec?.updatedAt||rec?.raw?.lastUpdated||""};
  const updated=updatedRec.updatedAt&&typeof dateTimeLabelFromRecord==="function"?dateTimeLabelFromRecord(updatedRec):updatedRec.updatedAt;
  let returnText="";
  if(expected)returnText=expected;
  else if(min&&max&&min!==max)returnText=`R${min}–R${max}`;
  else if(min)returnText=`R${min}`;
  else if(minW&&maxW&&minW!==maxW)returnText=`${minW}–${maxW} weeks`;
  else if(minW)returnText=`${minW} week${Number(minW)===1?"":"s"}`;
  return {type,returnText,src,updated:updated&&updated!=="unknown"?updated:""};
}

// Always visible on the card - no click required. Previously the only
// injury detail shown up front was a generic "INJURED" status tile; the
// actual injury type and expected return were real, correctly sourced data
// (NRL casualty ward / Zero Tackle) that existed the whole time but was
// buried one click deep behind "Details", which isn't what "tell me what's
// wrong and how long they're out" means in practice.
function playerCardInjurySummaryHtml(p,st,truth){
  const facts=injuryFactsFor(p,st,truth);
  if(!facts)return "";
  const headline=facts.type?`Injury: ${esc(facts.type)}`:"Injury reported";
  const returnLine=facts.returnText?`Expected return: ${esc(facts.returnText)}`:"Expected return: not yet confirmed";
  // Source/updated-at intentionally left off the always-visible summary -
  // that attribution still lives in the "Details" disclosure below
  // (playerCardInjuryDetailsHtml). This box is just injured/what/how long.
  return `<div style="margin-top:12px;border-radius:16px;background:rgba(255,77,77,.14);box-shadow:inset 0 0 0 1px rgba(255,77,77,.4);padding:12px 14px;color:#ffe1e1">
    <div style="font-size:11px;font-weight:900;letter-spacing:.08em;opacity:.85;color:#ffb3b3">INJURY UPDATE</div>
    <div style="font-size:17px;font-weight:950;margin-top:3px;color:#fff">${headline}</div>
    <div style="font-size:14px;font-weight:750;margin-top:2px">${returnLine}</div>
  </div>`;
}

function playerCardInjuryDetailsHtml(p,st,truth){
  const facts=injuryFactsFor(p,st,truth);
  if(!facts)return "";
  const lines=[];
  if(facts.type)lines.push(`Injury: ${facts.type}`);
  lines.push(facts.returnText?`Expected return: ${facts.returnText}`:"Injury details not yet confirmed");
  if(facts.src)lines.push(`Source: ${facts.src}`);
  if(facts.updated)lines.push(`Updated: ${facts.updated}`);
  return `<div style="border-top:1px solid rgba(255,255,255,.16);padding-top:10px"><b style="display:block;margin-bottom:6px">Injury information</b>${lines.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`;
}

window.openPlayerCard = function(name){
  const p = getPlayer(name);
  if(!p) return toast ? toast("Player not found") : null;

  window.closePlayerCard();

  const pr = roundProj(p);
  const st = availabilityStatus(p);
  const truth = (typeof statusTruthRecordFor === "function" ? statusTruthRecordFor(p) : null) || st?.truth || {};
  const fieldSlot = Object.keys(App.lineup || {}).find(k => App.lineup[k] === p.name);
  const inMyTeam = App.myTeam.includes(p.name);
  const reserveSlot = typeof reserveSlotForPlayerName === "function" ? reserveSlotForPlayerName(p.name) : "";
  const slotLabel = fieldSlot ? (slotById[fieldSlot]?.short || "FIELD") : (reserveSlot || (inMyTeam ? "RES" : "PLAYER"));

function truthRecordAnyRound(p){

  const players=App.statusTruth.players||App.statusTruth;
  if(!players||typeof players!=='object')return null;

  if(!rec){
    const key=playerKeyName(p.name);
    for(const [name,value] of Object.entries(players)){if(playerKeyName(name)===key){rec=value;break;}}
  }
  return rec&&typeof rec==='object'?rec:null;
}
function injuryWindowPhaseFromTruth(rec,round){
  const r=Number(round||0);
  const recRound=Number(rec?.round||App.statusTruth?.round||0);
  const redUntil=Number(rec?.injuryRedUntilRound||0);
  const riskUntil=Number(rec?.injuryRiskUntilRound||0);
  const hasWindow=Boolean(redUntil||riskUntil||rec?.expectedReturnRoundMin||rec?.expectedReturnRoundMax||rec?.injuryReturnKnown===true);
  const isInjury=truthKeyFromRecord(rec)==='injured'||!!rec?.injuryNote||!!rec?.injuryType||!!rec?.expectedReturnText;
  if(!isInjury)return '';
  if(r&&redUntil&&r<=redUntil)return 'red';
  if(r&&riskUntil&&r<=riskUntil)return 'yellow';
  if(r&&riskUntil&&r>riskUntil)return '';
  // Critical rule: do not copy a current-round injury chip through every future Bye Planner round
  // when the source has no known return window. Show it for the current truth round only.
  if(!hasWindow && r && recRound && r!==recRound)return '';
  return truthKeyFromRecord(rec)==='injured'?'red':'';
}

function suspensionWindowPhaseFromTruth(rec,round){
  const r=Number(round||0);
  const recRound=Number(rec?.round||App.statusTruth?.round||0);
  const start=Number(rec?.suspensionStartRound||rec?.round||0);
  const end=Number(rec?.suspensionEndRound||0);
  const isSusp=truthKeyFromRecord(rec)==='suspended'||!!rec?.suspensionMatches||!!rec?.suspensionEndRound;
  if(!isSusp||!r)return '';
  if(start&&r<start)return '';
  if(end&&r<=end)return 'pink';

  if(!end&&recRound&&r===recRound)return 'pink';

function truthSuspensionText(rec){

  const isSusp=truthKeyFromRecord(rec)==='suspended'||!!rec.suspensionMatches||!!rec.suspensionEndRound;
  if(!isSusp)return '';
  const bits=[];
  if(rec.suspensionMatches)bits.push(`Suspension: ${rec.suspensionMatches} match${Number(rec.suspensionMatches)===1?'':'es'}`);
  else bits.push('Suspended');
  if(rec.suspensionEndRound)bits.push(`Pink through R${rec.suspensionEndRound}`);
  if(rec.expectedReturnText)bits.push(`Return: ${rec.expectedReturnText}`);
  const src=truthSourceText(rec);
  if(src)bits.push(`Source: ${src}`);
  return bits.join(' · ');

  if(key==='extended'||key==='reserve'||key==='risk')return 'Selection risk';
  return st?.label||'Unavailable';
 };

 // Precompute round -> set of teams on bye in ONE pass over all players,
 // instead of the old byeTeamCount(round) which rescanned every player from
 // scratch. isMajorByeRound() below is called once per remaining round in
 // the rounds loop (~26x), so that used to be a full 563-player scan done
 // 26 times over for one render.
 const teamsByByeRound=new Map();
 App.players.forEach(p=>{
  const byes=(p.bye||p.byes||[]).map(Number);
  const t=String(p.team||p.club||'').trim();
  if(!t)return;
  for(const r of byes){
   if(!teamsByByeRound.has(r))teamsByByeRound.set(r,new Set());
   teamsByByeRound.get(r).add(t);
  }
 });
 const byeTeamCount=(round)=>teamsByByeRound.get(Number(round))?.size||0;

 const isMajorByeRound=(round)=>byeTeamCount(round)>=6;

 const legalStarterCover=(playable)=>{
  const slots=[...SLOT_DEFS].map(slot=>({
   slot,
   candidates:playable.filter(item=>eligible(item.player,slot))
  })).sort((a,b)=>a.candidates.length-b.candidates.length);

  let best={filled:[],used:new Set()};

  function search(i,filled,used){
   if(filled.length>best.filled.length){
    best={filled:[...filled],used:new Set(used)};
   }
   if(i>=slots.length)return;
   if(filled.length+(slots.length-i)<=best.filled.length)return;

   const {slot,candidates}=slots[i];

   for(const item of candidates){
    if(used.has(item.player.name))continue;
    used.add(item.player.name);
    filled.push({slot,item});
    search(i+1,filled,used);
    filled.pop();
    used.delete(item.player.name);
   }

   search(i+1,filled,used);
  }

  search(0,[],new Set());

  const filledSlotIds=new Set(best.filled.map(x=>x.slot.id));
  const missing=SLOT_DEFS.filter(slot=>!filledSlotIds.has(slot.id));

  return {filled:best.filled,missing,used:best.used};
 };

/* =========================================================
   CORE PERF FIX: canonical tab renderer, Level 3 cache, fast Explorer
   Scope: UI runtime only. No player data, DPP, status truth, fixtures, workflows,
   projection engine, or generated JSON changes.
   ========================================================= */
function forceOnlyActiveTab(){
  const active = App.active || 'team';
  document.querySelectorAll('section.tab').forEach(sec => {
    const on = sec.id === active;
    sec.classList.toggle('active-tab', on);
    sec.style.display = on ? 'block' : 'none';
    sec.style.visibility = on ? 'visible' : 'hidden';
    sec.style.position = on ? 'relative' : 'absolute';
    sec.style.left = on ? 'auto' : '-100000px';
    sec.style.width = on ? 'auto' : '1px';
    sec.style.height = on ? 'auto' : '1px';
    sec.style.overflow = on ? '' : 'hidden';
    sec.style.pointerEvents = on ? 'auto' : 'none';
  });
  document.querySelectorAll('nav button[data-tab]').forEach(btn => {
    const on = btn.dataset.tab === active;
    btn.classList.toggle('active', on);
    if (on) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });
}

function setActiveTab(tab){
  if (!['team','bye','level3','explorer','trade','season'].includes(tab)) tab = 'team';
  if (App.active === tab && App.__renderedTab === tab) {
    forceOnlyActiveTab();
    return;
  }
  App.active = tab;
  forceOnlyActiveTab();
  renderActive();
}

function wireTabs(){
  document.querySelectorAll('nav button[data-tab]').forEach(b => {
    b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); setActiveTab(b.dataset.tab); return false; };
    b.ontouchend = ev => { ev.preventDefault(); ev.stopPropagation(); setActiveTab(b.dataset.tab); return false; };
  });
}

function renderActive(){
  try {
    forceOnlyActiveTab();
    if (App.active === 'team') renderTeam();
    else if (App.active === 'bye') renderBye();
    else if (App.active === 'level3') renderLevel3();
    else if (App.active === 'explorer') renderExplorer();
    else if (App.active === 'trade') renderTrade();
    else if (App.active === 'season') renderSeason();
    App.__renderedTab = App.active;
    forceOnlyActiveTab();
    refreshOpenPlayerCardAfterRender();
  } catch (err) {
    console.error(err);
    const el = $(App.active);
    if (el) el.innerHTML = `<div class="panel"><h2>Screen failed to render</h2><p class="bad">${esc(err.message || err)}</p><p class="small">This safety message prevents a blank page. Send a screenshot of this error if it appears.</p></div>`;
    forceOnlyActiveTab();
  }
}

/* Crystal Ball - see the CSS comment above .l3-accuracy-card for the
   full rationale. Two honest states: still gathering real samples (a
   progress gauge, never a fabricated accuracy number), or the real
   metric once data/projection_accuracy.json's own MIN_SAMPLES gates say
   it can be trusted (see build-projection-accuracy.mjs). */
function renderProjectionAccuracy(){
  const acc = App.projectionAccuracy;

  if(!acc || !acc.overall){
    const total = safeNum(acc?.totalComparisons) || 0;
    const needed = safeNum(acc?.minSamplesOverall) || 20;
    return `<div class="l3-accuracy-card">
     <div class="wr-hero-row">

       <p>${total} of ${needed} real round results collected so far. Projection accuracy shows up here honestly once there's enough real data to trust it - never guessed at.</p>
      </div>
     </div>
    </div>`;
  }

  const mae = acc.overall.meanAbsoluteError;
  const bias = acc.overall.meanBias;
  const biasTier = Math.abs(bias) < 2 ? 'neutral' : bias > 0 ? 'under' : 'over';
  const biasLabel = biasTier === 'neutral'
    ? 'No consistent bias'
    : biasTier === 'under'
      ? `Tends to underestimate by ~${Math.abs(bias)} pts`
      : `Tends to overestimate by ~${Math.abs(bias)} pts`;
  const positions = Object.entries(acc.byPosition || {});

  return `<div class="l3-accuracy-card">
   <div class="wr-hero-row">
    <div class="wr-hero-icon">${wrIcon('crystal')}</div>
    <div>
     <p class="l3-kicker">Crystal Ball</p>
     <h2 style="margin:2px 0">Real Projection Accuracy</h2>
     <p>Based on ${acc.overall.samples} real results across ${acc.roundsCompared.length} round(s) this season.</p>
    </div>
   </div>
   <div class="l3-accuracy-stats">
    <div class="l3-accuracy-stat"><b>±${mae}</b><span>Avg Error (pts)</span></div>
    <div class="l3-accuracy-stat"><span class="l3-accuracy-bias ${biasTier}">${esc(biasLabel)}</span></div>
   </div>
   ${positions.length ? `<div class="l3-accuracy-positions">${positions.map(([pos, s]) => `<div class="l3-accuracy-pos-pill">${esc(pos)}: ±${s.meanAbsoluteError}<small>(${s.samples})</small></div>`).join('')}</div>` : ''}
  </div>`;
}

/* Form Radar - a real, league-wide "who's actually hot/cold right now"
   view, built entirely from data already on every player's own record
   (last3Avg/seasonAvg - the same numbers already shown as stat tiles on
   the player card). Never a separate fetch or a guessed number: a
   player only appears once they have a genuine last3Avg and a season
   average with a reasonable sample (seasonAvg >= 25), so a fringe
   player who has barely played can't dominate the list off one big
   game. Complements the per-player Form Sparkline with a cross-player
   discovery view - who's trending, not just how one player has trended. */
function formRadarRows(){
 return (App.players || [])
  .filter(p => p && p.name && p.team)
  .map(p => { const pr = roundProj(p); return { p, pr, delta: (pr.last3Avg||0) - (pr.seasonAvg||0) }; })
  .filter(o => o.pr.seasonAvg >= 25 && o.pr.last3Avg > 0);
}
function formRadarCardHtml(){
 const rows = formRadarRows();
 if(rows.length < 6) return '';
 // A +/-5pt threshold, not just "any positive/negative delta" - round-to-
 // round noise on real scores easily produces a +1 or -1 that isn't a real
 // trend, and showing it as a "riser" would be misleading.
 const risers = [...rows].sort((a, b) => b.delta - a.delta).slice(0, 5).filter(o => o.delta >= 5);
 const fallers = [...rows].sort((a, b) => a.delta - b.delta).slice(0, 5).filter(o => o.delta <= -5);
 if(!risers.length && !fallers.length) return '';
 const row = (o, dir) => `<div class="l3-form-row"><span class="player-name-link" role="button" tabindex="0" onclick="openPlayerCard('${window.jsq(o.p.name)}')">${esc(o.p.name)}</span><span class="l3-form-meta">${esc(positionText(o.p))} · ${esc(o.p.team||'')}</span><b class="l3-form-delta ${dir}">${dir==='up'?'+':''}${Math.round(o.delta)}</b></div>`;
 return `<div class="l3-form-radar-card">
  <div class="wr-hero-row">
   <div class="wr-hero-icon">${wrIcon('pulse')}</div>
   <div>
    <p class="l3-kicker">Form Radar</p>
    <h2 style="margin:2px 0">Real Risers &amp; Fallers</h2>
    <p>Last 3 rounds vs season average, across the real player pool - who's genuinely heating up or cooling off right now.</p>
   </div>
  </div>
  <div class="l3-form-radar-cols">
   ${risers.length ? `<div class="l3-form-col"><h3>Risers</h3>${risers.map(o => row(o, 'up')).join('')}</div>` : ''}
   ${fallers.length ? `<div class="l3-form-col"><h3>Fallers</h3>${fallers.map(o => row(o, 'down')).join('')}</div>` : ''}
  </div>
 </div>`;
}

/* Season Journey - the real, honest history of what your OWN team has
   actually scored, round by round (see the Season Journey block near
   loadFormHistory() for the capture/finalize logic). Renders a real SVG
   line chart from actual entries only - never interpolating or
   fabricating a round that hasn't been recorded or scored yet. */
function seasonChartSvg(scored){
 const w=760,h=220,padL=44,padR=16,padT=16,padB=32;
 const scores=scored.map(e=>e.actualScore);
 const lo=Math.min(...scores,0),hi=Math.max(...scores);
 const span=(hi-lo)||1;
 const coords=scored.map((e,i)=>{
  const x=scored.length>1?padL+(i/(scored.length-1))*(w-padL-padR):(w/2);
  const y=padT+(1-(e.actualScore-lo)/span)*(h-padT-padB);
  return {x,y,round:e.round,score:e.actualScore};
 });
 const lineD=coords.map((c,i)=>`${i===0?'M':'L'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
 const areaD=`${lineD} L${coords[coords.length-1].x.toFixed(1)},${(h-padB).toFixed(1)} L${coords[0].x.toFixed(1)},${(h-padB).toFixed(1)} Z`;
 const dots=coords.map(c=>`<circle class="season-dot" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4"/>`).join('');
 const labels=coords.map(c=>`<text class="season-axis-label" x="${c.x.toFixed(1)}" y="${h-10}" text-anchor="middle">R${esc(c.round)}</text>`).join('');
 return `<svg class="season-chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Your team's real round-by-round score">
  <defs><linearGradient id="seasonAreaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".7"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs>
  <path class="season-area" d="${areaD}"/>
  <path class="season-line" d="${lineD}"/>
  ${dots}
  ${labels}
 </svg>`;
}
function renderSeason(){

 }

function updateExplorer(){
  const input = $('explorerInput');
  const q = norm(input?.value || '');
  const box = $('explorerResults');
  if (!box) return;

  const filter = App.explorerFilter || 'all';
  let res = App.players.filter(p => {
    const st = availabilityStatus(p);
    const rec = typeof truthRecordAnyRound === 'function' ? (truthRecordAnyRound(p) || {}) : {};
    const badge = statusBadgeForPlayer(p);
    const cat = typeof explorerStatusCategory === 'function' ? explorerStatusCategory(p) : (badge.category || 'other');

    if (filter !== 'all' && cat !== filter) return false;
    if (!q) return true;

    const hay = norm([
      p.name,
      p.pos,
      p.team,
      positionText(p),
      badge.text,
      badge.label,
      badge.colourName,
      badge.reason,
      st?.label,
      st?.reason,
      rec.displayStatus,
      rec.reason,
      rec.selectionStatus,
      rec.originStatus
    ].filter(Boolean).join(' '));

    return hay.includes(q);
  });

  res = res
    .map(p => ({ p, pr: roundProj(p) }))
    .sort((a, b) => b.pr.expected - a.pr.expected)
    .slice(0, 40);

  const defaultView = !q && filter === 'all';
  const heading = defaultView
    ? '<p class="small explorer-default-heading">Top 40 by expected score this round - search or filter above to narrow it down.</p>'
    : '';

  box.innerHTML = heading + (res.map(row => {
    const p = row.p;
    const pr = row.pr;
    const weather = weatherLine(p);
    const detail = typeof statusDetailHtml === 'function' ? statusDetailHtml(p) : '';
    const gkNote = (pr.reasons || []).find(r => /kick/i.test(r)) || 'No goal-kicking boost';
    return `<div class="result"><span class="explorer-player-line">${teamIconHtml(p,'explorer-team-badge')}<b class="player-name-link" role="button" tabindex="0" onpointerdown="event.preventDefault();event.stopPropagation();event.stopImmediatePropagation()" onclick="event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();openPlayerCard('${window.jsq(p.name)}')">${esc(p.name)}</b> ${statusPill(p)} <span class="small">${esc(positionText(p))} - ${esc(p.team||'')}</span></span><br>Price: ${money(p.price)} | Avg: ${safeNum(p.avg||p.average)} | BE: ${p.be??p.breakEven??'N/A'}<br>Floor ${pr.floor} / <b>Expected ${pr.expected}</b> / Ceiling ${pr.ceiling}<br>${weather?`<span class="small">${weather}</span><br>`:''}${detail?detail+'<br>':''}<span class="small">${esc(gkNote)}</span></div>`;
  }).join('') || '<div class="wr-empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg><div class="wr-empty-title">No matches</div><div class="wr-empty-sub">Try a different name, or clear the filter above to see the real top 40.</div></div>');
}

/* =========================================================
   V40: Projection v2 UI detail overrides
   ========================================================= */
function projectionReasonHtml(pr){return pr?.reasons?.length?`<div class="small">Why: ${pr.reasons.map(esc).join(' | ')}</div>`:''}
function projectionRiskPill(pr){return `<span class="pill ${pr.risk==='High'?'bad':pr.risk==='Medium'?'warn':'good'}">${esc(pr.confidence||'Medium')} confidence | ${esc(pr.risk||'Medium')} risk</span>`}

/* =========================================================
   V41: Final Status Arbitration Guard
   System logic only. No player-specific fixes or overrides.
   Prevents GREEN/unavailable contradictions and fixes zero-projection risk text.
   ========================================================= */
const wrOriginalAvailabilityStatusV41 = availabilityStatus;
const wrOriginalRoundProjV41 = roundProj;
const wrOriginalProjectionRiskPillV41 = projectionRiskPill;

function wrV41Text(v){return String(v==null?'':v)}
function wrV41Num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function wrV41Key(v){return wrV41Text(v).toLowerCase().replace(/[\s-]+/g,'_')}
function wrV41Truth(p){try{return typeof truthRecordAnyRound==='function'?(truthRecordAnyRound(p)||{}):{}}catch{return {}}}
function wrV41StatusRec(p){try{return typeof statusFor==='function'?(statusFor(p)||{}):{}}catch{return {}}}
function wrV41OverrideRec(p){try{return typeof overrideFor==='function'?(overrideFor(p)||{}):{}}catch{return {}}}
function wrV41Jersey(rec,p){return wrV41Num(rec?.jersey||rec?.shirtNo||rec?.number||p?.jersey||p?.shirtNo||p?.number)}
function wrV41InjuryText(rec){try{return typeof truthInjuryText==='function'?(truthInjuryText(rec)||''):''}catch{return ''}}
function wrV41ReturnRound(text){
  text=wrV41Text(text);
  const m=text.match(/return\s*:?\s*(?:round\s*)?r?\s*(\d+)/i)||text.match(/back\s*(?:around|in)?\s*r?\s*(\d+)/i);
  return m?Number(m[1]):null;
}
function wrV41RedThroughRound(text){
  text=wrV41Text(text);
  const m=text.match(/red\s+through\s+r?\s*(\d+)/i)||text.match(/out\s+through\s+r?\s*(\d+)/i);
  return m?Number(m[1]):null;
}
function wrV41HardUnavailableForRound(p,round,base){
  const rec=wrV41Truth(p), ss=wrV41StatusRec(p), ov=wrV41OverrideRec(p);
  const text=[base?.reason,rec?.reason,rec?.displayStatus,rec?.selectionStatus,rec?.injuryStatus,rec?.injury,rec?.status,wrV41InjuryText(rec),ss?.reason,ss?.status,ov?.reason,ov?.status].filter(Boolean).join(' | ');
  const lower=text.toLowerCase();
  const minRounds=[rec?.returnWindowMinRound,ss?.returnWindowMinRound,ov?.returnWindowMinRound,wrV41ReturnRound(text)].map(Number).filter(Number.isFinite);
  const redThrough=wrV41RedThroughRound(text);
  const selected=Number(round||App.round||0);
  const playableRole=String(rec?.lineupRole||rec?.selectionRole||'').toLowerCase();
  const playableNamed=(rec?.available!==false)&&String(rec?.displayStatus||rec?.status||'').toUpperCase()==='NAMED'&&(playableRole==='starter'||playableRole==='interchange');
  if(lower.includes('suspended'))return {kind:'suspended',reason:text||'Suspended'};
  if(playableNamed)return null;
  if(redThrough!=null&&selected<=redThrough)return {kind:'injured',reason:text||`Unavailable through R${redThrough}`};
  if(minRounds.some(r=>selected<r)&&(lower.includes('injur')||lower.includes('calf')||lower.includes('hamstring')||lower.includes('knee')||lower.includes('shoulder')||lower.includes('return')||lower.includes('red through'))){
    const r=Math.min(...minRounds.filter(r=>selected<r));
    return {kind:'injured',reason:text||`Expected return R${r}`};
  }
  if(lower.includes('suspended'))return {kind:'suspended',reason:text||'Suspended'};
  return null;
}
function wrV41ArbitrateStatus(p,round,base){
  if(!p||!base)return base;
  const rec=wrV41Truth(p);
  // Absolute status precedence: BYE is final and cannot be relabelled as injured/suspended
  // by old injury text, player notes, or fallback status fields.
  const baseKey=wrV41Key(base.key||base.label);
  const recKey=(typeof truthKeyFromRecord==='function') ? truthKeyFromRecord(rec) : '';
  const recColour=wrV41Text(rec?.colour||rec?.color).toLowerCase().trim();
  const recSelection=wrV41Key(rec?.selectionStatus||rec?.displayStatus||rec?.status);
  if(baseKey==='bye'||baseKey.includes('bye')||recKey==='bye'||recColour==='purple'||recSelection==='bye'){
    return {
      ...base,
      key:'bye',
      available:false,
      label:'BYE',
      reason:base.reason||rec.reason||`Bye round ${round}`,
      source:base.source||'data/status_truth.json',
      truth:base.truth||rec
    };
  }
  const jersey=wrV41Jersey(rec,p);
  const hard=wrV41HardUnavailableForRound(p,round,base);
  if(hard){
    if(hard.kind==='suspended')return {...base,key:'suspended',available:false,label:'Suspended',reason:hard.reason||base.reason||'Suspended'};
    return {...base,key:'injured',available:false,label:'Injured',reason:hard.reason||base.reason||'Injured/unavailable for selected round'};
  }
  const key=wrV41Key(base.key);
  if((key==='good'||key==='named'||base.available===true)&&jersey>=18&&jersey<=19){
    return {...base,key:'risk',available:true,label:'Emergency',reason:`Emergency jersey ${jersey}; not a confirmed playable 17`};
  }
  // Jersey number alone does not decide team-list role; do not mark 20+ as not named here.
  return base;
}
availabilityStatus = function availabilityStatusV41(p,round=App.round){
  // This is the actual entry point every real call in the app goes through (the base
  // availabilityStatus() and the V18 wrapper it delegates to both get bypassed whenever
  // enhancedStatusFromTruth() answers, which is true for virtually every player) - so the manual
  // override must be checked here, not only inside those inner layers, or it stays dead code.
  const overrideStatus=(typeof freshExplicitOverrideStatus==='function')?freshExplicitOverrideStatus(p,round):null;
  if(overrideStatus)return overrideStatus;
  const base=wrOriginalAvailabilityStatusV41(p,round);
  return wrV41ArbitrateStatus(p,round,base);
};

let __roundProjV41Cache=null;
// refreshTrustDataNow()'s 10-minute cycle pulls fresh status/injury/weather
// data and clears App.projectionCache, but that Map was never actually read
// by this cache - roundProj was overridden below to keep its own cache,
// keyed only by round, with no link back to App.projectionCache. That let
// a mid-session status change (e.g. a player going from fit to injured)
// keep serving the stale pre-refresh projection until the round itself
// changed. invalidateRoundProjCache() is called from refreshTrustDataNow()
// so a real data refresh busts it too, not just a round change.
function invalidateRoundProjCache(){__roundProjV41Cache=null}
roundProj = function roundProjV41(p){
  if(!p)return {floor:0,expected:0,ceiling:0,raw:0};
  // This override replaces the base roundProj() entirely (the assignment
  // above, not a new function declaration), which is why an earlier
  // caching attempt on the base function had zero effect - every real
  // call in the app goes through THIS implementation. Every tab
  // (formation cards, Level 3, Trade Radar...) calls this per player per
  // render with no sharing, and it does two real passes every time
  // (ProjectionEngine.project + availabilityStatus). Cache by player name
  // for the current round; a round change is the only thing that should
  // invalidate it.
  if(!__roundProjV41Cache||__roundProjV41Cache.round!==App.round){
   __roundProjV41Cache={round:App.round,map:new Map()};
  }
  const key=p.name;
  if(key&&__roundProjV41Cache.map.has(key))return __roundProjV41Cache.map.get(key);
  const pr=(typeof ProjectionEngine==='object')?ProjectionEngine.project(p,App.round):wrOriginalRoundProjV41(p);
  const st=availabilityStatus(p);
  let result;
  if(!st?.available){
    const rkey=wrV41Key(st.key||st.label);
    let risk='Unavailable', confidence='No projection';
    if(rkey.includes('bye'))risk='Bye';
    else if(rkey.includes('suspended'))risk='Suspended';
    else if(rkey.includes('injur'))risk='Injured';
    else if(rkey.includes('not'))risk='Not named';
    else if(rkey.includes('origin'))risk='Origin unavailable';
    result={...pr,expected:0,floor:0,ceiling:0,risk,confidence,projectionUnavailable:true,reasons:[...(pr?.reasons||[]),st.reason||st.label||'Unavailable']};
  }else{
   result=pr;
  }
  if(key)__roundProjV41Cache.map.set(key,result);
  return result;
};

projectionRiskPill = function projectionRiskPillV41(pr){
  if(pr?.projectionUnavailable||String(pr?.confidence||'').toLowerCase()==='no projection'){
    return `<span class="pill bad">${esc(pr.confidence||'No projection')} | ${esc(pr.risk||'Unavailable')}</span>`;
  }
  return wrOriginalProjectionRiskPillV41(pr);
};
/* =========================================================
   V42: Final player photo resolver override
   Generic only. No player-specific hard fixes.
   ========================================================= */
function wrV42PhotoText(v){return String(v==null?'':v)}
function wrV42PhotoKey(v){
  return wrV42PhotoText(v)
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[\u2018\u2019`\u00b4]/g,"'")
    .replace(/&apos;|&#39;/g,"'")
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function wrV42PhotoSlug(v){
  return wrV42PhotoKey(v).replace(/\s+/g,'-').replace(/^-+|-+$/g,'');
}
function wrV42PhotoUrlFromRecord(rec){
  if(!rec)return '';
  if(typeof rec==='string')return rec;
  return rec.url||rec.photo||rec.image||rec.headshot||rec.src||rec.photoUrl||rec.imageUrl||rec.headshotUrl||'';
}
function wrV42DirectImageUrl(url){
  return wrV42PhotoText(url).trim().replace(/&amp;/g,'&');
}
function wrV42UsablePhotoUrl(url){
  const u=wrV42DirectImageUrl(url);
  if(!/^https?:\/\//i.test(u))return false;
  if(/favicon|badge|icon|sponsor|partner|placeholder|default|crest|(^|[\/_.-])logo([\/_.-]|$)/i.test(u))return false;
  return /rugbyimages\.statsperform\.com|Player%20Bodyshots|Player\+Bodyshots|remote\.axd\?|\.png(\?|$)|\.jpg(\?|$)|\.jpeg(\?|$)|\.webp(\?|$)/i.test(u);
}
function wrV42FindPhotoRecord(p){
  const photos=App.playerPhotos?.players||App.playerPhotos||{};
  const names=[p?.name,p?.fullName,p?.playerName,p?.statsSourceName].filter(Boolean);

  for(const n of names){
    if(photos[n])return photos[n];
  }

  const wanted=new Set();
  for(const n of names){
    wanted.add(wrV42PhotoKey(n));
    wanted.add(wrV42PhotoSlug(n));
  }

  for(const [key,rec] of Object.entries(photos||{})){
    if(wanted.has(wrV42PhotoKey(key))||wanted.has(wrV42PhotoSlug(key)))return rec;
  }

  return null;
}
function wrV42FinalPlayerPhotoUrl(p){
  if(!p)return '';

  const rec=wrV42FindPhotoRecord(p);
  const mapped=wrV42DirectImageUrl(wrV42PhotoUrlFromRecord(rec));
  if(wrV42UsablePhotoUrl(mapped))return mapped;

  for(const k of ['photo','photoUrl','image','imageUrl','headshot','headshotUrl','nrlPhoto','nrlPhotoUrl','playerPhoto']){
    const u=wrV42DirectImageUrl(p?.[k]);
    if(wrV42UsablePhotoUrl(u))return u;
  }

  return '';
}

playerPhotoUrl = wrV42FinalPlayerPhotoUrl;
wrCardPlayerPhotoUrl = wrV42FinalPlayerPhotoUrl;
