name: Browser UI tests

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/ui-browser/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-ui-tests.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "tests/ui-browser/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser-driven UI tests
        run: node --test tests/ui-browser/*.test.mjs
