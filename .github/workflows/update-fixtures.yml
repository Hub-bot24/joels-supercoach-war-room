name: Update Fixtures

"on":
  workflow_dispatch:
  # This had no schedule at all - fixtures.json (next-game venue, opponent,
  # kickoff time) only ever updated when someone manually ran it, unlike
  # weather (15 min) and now prices (2h-gated), which auto-refresh on their
  # own. That's the actual risk for a card showing inconsistent round
  # info, not the reverse. The draw rarely changes mid-week, but the NRL
  # does occasionally reschedule a match for broadcast reasons, so check a
  # few times a day rather than leaving it to chance.
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TEST ONLY - inspect live per-player page structure
        run: node scripts/_diag-player-page.mjs

      - name: Update fixtures
        run: node scripts/update-fixtures.mjs

      - name: Commit fixtures
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fixtures.json fixtures_update_report.json
          git commit -m "Update full fixture draw and byes" || echo "No changes"
          git push